<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Koderyon — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pearl-1:#E5E5E5;
  --pearl-2:#D9D9D9;
  --transition-theme: background-color .45s ease, color .45s ease, border-color .45s ease, box-shadow .45s ease;
}
html[data-theme="light"]{
  --bg:#FFFFFF;
  --text:#0A0A0A;
  --text-dim:#6B6B6B;
  --card:#FFFFFF;
  --card-border:#E3E3E3;
  --shadow:0 10px 40px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --input-bg:#FAFAFA;
  --input-border:#E0E0E0;
  --accent-1:var(--pearl-1);
  --accent-2:var(--pearl-2);
  --btn-bg:#0A0A0A;
  --btn-text:#FFFFFF;
  --glow:rgba(217,217,217,0.9);
  --divider:#EAEAEA;
}
html[data-theme="dark"]{
  --bg:#000000;
  --text:#FAFAFA;
  --text-dim:#8C8C8C;
  --card:#161616;
  --card-border:#2A2A2A;
  --shadow:0 10px 40px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
  --input-bg:#1C1C1C;
  --input-border:#303030;
  --accent-1:#2A2A2A;
  --accent-2:#3D3D3D;
  --btn-bg:#FFFFFF;
  --btn-text:#0A0A0A;
  --glow:rgba(255,255,255,0.85);
  --divider:#232323;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
  transition: var(--transition-theme);
  overflow-x:hidden;
  min-height:100vh;
  width:100vw;
}
.wrap{
  display:flex;
  min-height:100vh;
  width:100vw;
}
.theme-toggle{
  position:fixed;
  top:22px;
  right:22px;
  z-index:50;
  width:52px;
  height:30px;
  border-radius:20px;
  background:var(--input-bg);
  border:1px solid var(--input-border);
  cursor:pointer;
  display:flex;
  align-items:center;
  padding:3px;
  transition:var(--transition-theme);
}
.theme-toggle .knob{
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--text);
  transition:transform .35s cubic-bezier(.65,0,.35,1), background .35s ease;
  transform:translateX(0);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
}
html[data-theme="dark"] .theme-toggle .knob{ transform:translateX(22px); }

.left-panel{
  width:50%;
  min-height:100vh;
  position:relative;
  background:#0D0D0D;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}
html[data-theme="light"] .left-panel{
  background:#111111;
}
.editor-shell{
  width:82%;
  max-width:640px;
  height:74%;
  background:#151515;
  border-radius:10px;
  border:1px solid #262626;
  box-shadow:0 30px 80px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  transition: opacity .6s ease, transform .6s ease, filter .6s ease;
}
.editor-shell.leaving{
  opacity:0;
  transform:scale(0.94);
  filter:blur(6px);
}
.editor-topbar{
  height:38px;
  background:#1E1E1E;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:8px;
  border-bottom:1px solid #262626;
  flex-shrink:0;
}
.dot{ width:11px; height:11px; border-radius:50%; }
.dot.red{ background:#FF5F56; }
.dot.yellow{ background:#FFBD2E; }
.dot.green{ background:#27C93F; }
.filename{
  margin-left:14px;
  font-family:'JetBrains Mono', monospace;
  font-size:12px;
  color:#9A9A9A;
  display:flex;
  align-items:center;
  gap:6px;
}
.run-btn{
  margin-left:auto;
  background:#2A2A2A;
  color:#E8E8E8;
  border:1px solid #383838;
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  padding:5px 12px;
  border-radius:5px;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:transform .15s ease, background .15s ease;
  position:relative;
}
.run-btn.pressed{ transform:scale(0.9); background:#3A3A3A; }
.run-btn svg{ width:9px; height:9px; }

.editor-body{
  flex:1;
  display:flex;
  overflow-x:hidden;
  overflow-y:auto;
  font-family:'JetBrains Mono', monospace;
  font-size:13px;
  line-height:1.65;
  scrollbar-width:thin;
  scrollbar-color:#3A3A3A transparent;
}
.line-numbers{
  padding:16px 12px;
  text-align:right;
  color:#4A4A4A;
  user-select:none;
  min-width:38px;
  border-right:1px solid #232323;
  white-space:pre;
  flex-shrink:0;
}
.code-area{
  padding:16px 18px;
  white-space:pre;
  color:#D4D4D4;
  overflow-x:auto;
  flex:1;
  scrollbar-width:thin;
  scrollbar-color:#3A3A3A transparent;
}
.tok-tag{ color:#C9C9C9; font-weight:600; }
.tok-attr{ color:#9A9A9A; }
.tok-string{ color:#7E7E7E; font-style:italic; }
.tok-comment{ color:#5A5A5A; font-style:italic; }
.tok-punct{ color:#666; }
.editor-body::-webkit-scrollbar, .code-area::-webkit-scrollbar{
  width:6px; height:6px;
}
.editor-body::-webkit-scrollbar-thumb, .code-area::-webkit-scrollbar-thumb{
  background:#3A3A3A; border-radius:4px;
}
.editor-body::-webkit-scrollbar-track, .code-area::-webkit-scrollbar-track{
  background:transparent;
}
.caret{
  display:inline-block;
  width:7px;
  height:14px;
  background:#E8E8E8;
  vertical-align:middle;
  animation:blink 1s step-end infinite;
}
@keyframes blink{ 50%{ opacity:0; } }

.fake-cursor{
  position:absolute;
  width:16px;
  height:16px;
  z-index:30;
  opacity:0;
  pointer-events:none;
  transition: left 1s cubic-bezier(.65,0,.35,1), top 1s cubic-bezier(.65,0,.35,1), opacity .3s ease;
}
.fake-cursor svg{ width:100%; height:100%; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

.output-screen{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:11%;
  opacity:0;
  pointer-events:none;
}
.output-screen.show{
  opacity:1;
  pointer-events:auto;
  animation: outfade .9s ease forwards;
}
@keyframes outfade{ from{ opacity:0; } to{ opacity:1; } }

.particle{
  position:absolute;
  border-radius:50%;
  background:rgba(230,230,230,0.5);
  pointer-events:none;
}
html[data-theme="light"] .particle{ background:rgba(200,200,200,0.6); }

.welcome-text{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size:clamp(2.4rem, 5vw, 4.2rem);
  color:#F5F5F5;
  line-height:1.05;
  letter-spacing:-0.02em;
  opacity:0;
  transform:scale(0.9);
  position:relative;
  z-index:2;
}
.welcome-text.animate{
  animation: welcomeIn 1.6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes welcomeIn{
  0%{ opacity:0; transform:scale(0.88); text-shadow:0 0 0 rgba(255,255,255,0); }
  55%{ opacity:1; transform:scale(1.03); }
  100%{ opacity:1; transform:scale(1); text-shadow:0 0 50px var(--glow), 0 0 110px var(--glow); }
}
.welcome-sub{
  font-family:'Inter', sans-serif;
  font-size:15px;
  color:#8C8C8C;
  margin-top:16px;
  opacity:0;
  position:relative;
  z-index:2;
}
.welcome-sub.animate{
  animation: subIn 1s ease 1.1s forwards;
}
@keyframes subIn{ to{ opacity:1; } }

.right-panel{
  width:50%;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  transition:var(--transition-theme);
  flex-shrink:0;
  padding:48px 0;
}
.auth-card{
  width:100%;
  max-width:400px;
  padding:0 clamp(20px, 5vw, 40px);
}
.logo{
  display:flex;
  align-items:center;
  gap:11px;
  margin-bottom:36px;
}
.logo-mark{
  width:30px;
  height:30px;
  object-fit:contain;
  display:block;
  filter:brightness(0) saturate(100%);
  transition:filter .35s ease;
}
html[data-theme="dark"] .logo-mark{
  filter:brightness(0) saturate(100%) invert(1);
}
.logo-word{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size:19px;
  letter-spacing:-0.01em;
}

.mode-toggle{
  position:relative;
  display:flex;
  background:var(--input-bg);
  border:1px solid var(--input-border);
  border-radius:12px;
  padding:4px;
  margin-bottom:32px;
}
.mode-toggle button{
  flex:1;
  padding:10px 0;
  background:transparent;
  border:none;
  font-family:'Inter', sans-serif;
  font-weight:500;
  font-size:13.5px;
  color:var(--text-dim);
  cursor:pointer;
  position:relative;
  z-index:2;
  transition:color .3s ease;
}
.mode-toggle button.active{ color:var(--text); }
.mode-slider{
  position:absolute;
  top:4px; left:4px;
  width:calc(50% - 4px);
  height:calc(100% - 8px);
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:9px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  transition:transform .4s cubic-bezier(.65,0,.35,1);
  z-index:1;
}
.mode-toggle.register .mode-slider{ transform:translateX(100%); }

.form-stack{ position:relative; }
.form-panel{
  display:flex;
  flex-direction:column;
  gap:16px;
  animation: formIn .45s ease;
}
@keyframes formIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
.field label{
  display:block;
  font-size:12.5px;
  font-weight:500;
  color:var(--text-dim);
  margin-bottom:7px;
}
.field input[type="text"], .field input[type="email"], .field input[type="password"]{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid var(--input-border);
  background:var(--input-bg);
  color:var(--text);
  font-family:'Inter', sans-serif;
  font-size:13.5px;
  outline:none;
  transition:border-color .25s ease, background .25s ease;
}
.field input::placeholder{ color:var(--text-dim); opacity:.6; }
.field input:focus{ border-color:var(--text); }

.row-between{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12.5px;
}
.checkbox-line{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--text-dim);
}
.checkbox-line input{ accent-color:var(--text); width:14px; height:14px; }
.link{
  color:var(--text-dim);
  text-decoration:none;
  border-bottom:1px solid transparent;
  transition:border-color .2s ease, color .2s ease;
}
.link:hover{ color:var(--text); border-color:var(--text-dim); }

.terms-line{
  display:flex;
  align-items:flex-start;
  gap:8px;
  font-size:12px;
  color:var(--text-dim);
  line-height:1.4;
}
.terms-line input{ margin-top:2px; accent-color:var(--text); width:14px; height:14px; flex-shrink:0; }

.primary-btn{
  width:100%;
  padding:13px 0;
  border-radius:10px;
  border:none;
  background:var(--btn-bg);
  color:var(--btn-text);
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size:13.5px;
  cursor:pointer;
  margin-top:4px;
  transition:opacity .2s ease, transform .15s ease;
}
.primary-btn:hover{ opacity:0.86; }
.primary-btn:active{ transform:scale(0.98); }

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:26px 0 18px;
  color:var(--text-dim);
  font-size:11.5px;
}
.divider::before, .divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--divider);
}

.social-row{
  display:flex;
  gap:10px;
}
.social-btn{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 0;
  border-radius:10px;
  border:1px solid var(--input-border);
  background:var(--card);
  color:var(--text);
  font-family:'Inter', sans-serif;
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  transition:background .2s ease, border-color .2s ease;
}
.social-btn:hover{ background:var(--input-bg); border-color:var(--text-dim); }
.social-btn svg{ width:15px; height:15px; }

@media (max-width:960px){
  .wrap{ flex-direction:column; }
  .left-panel, .right-panel{ width:100%; }
  .left-panel{ min-height:60vh; padding:24px 0; }
  .right-panel{ min-height:auto; padding:40px 0 56px; }
  .editor-shell{ width:90%; max-width:520px; height:340px; }
}

@media (max-width:960px) and (min-width:641px){
  .left-panel{ min-height:52vh; padding:32px 0; }
  .editor-shell{ width:78%; max-width:600px; height:380px; }
  .editor-body{ font-size:13px; }
  .welcome-text{ font-size:clamp(2.2rem, 6vw, 3.4rem); }
  .welcome-sub{ font-size:14.5px; }
  .auth-card{ max-width:460px; padding:0 clamp(28px, 6vw, 56px); }
  .social-row{ flex-direction:row; }
  .theme-toggle{ top:20px; right:20px; }
}

@media (max-width:640px){
  .left-panel{ min-height:52vh; }
  .editor-shell{ width:92%; height:300px; }
  .editor-body{ font-size:11.5px; }
  .line-numbers{ min-width:28px; padding:12px 8px; }
  .code-area{ padding:12px 14px; }
  .welcome-text{ font-size:clamp(1.8rem, 8vw, 2.6rem); }
  .welcome-sub{ font-size:13px; margin-top:10px; }
  .output-screen{ padding-left:8%; padding-right:8%; justify-content:center; text-align:center; }
  .auth-card{ max-width:100%; padding:0 24px; }
  .logo{ margin-bottom:28px; }
  .theme-toggle{ top:16px; right:16px; }
  .social-row{ flex-direction:column; }
}

@media (max-width:400px){
  .editor-shell{ height:260px; }
  .editor-topbar{ padding:0 10px; }
  .run-btn{ padding:4px 9px; font-size:10px; }
  .filename{ font-size:11px; margin-left:8px; }
}
</style>
</head>

<script>
const root = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const knob = document.getElementById('knob');
function setTheme(t){
  root.setAttribute('data-theme', t);
  knob.textContent = t === 'dark' ? '☾' : '☀';
}
setTheme('light');
themeToggle.addEventListener('click', () => {
  const cur = root.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});

const modeToggle = document.getElementById('modeToggle');
const tabLogin = document.getElementById('tabLogin');
const tabRegister = document.getElementById('tabRegister');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

tabLogin.addEventListener('click', () => {
  modeToggle.classList.remove('register');
  tabLogin.classList.add('active');
  tabRegister.classList.remove('active');
  loginForm.style.display = 'flex';
  registerForm.style.display = 'none';
});
tabRegister.addEventListener('click', () => {
  modeToggle.classList.add('register');
  tabRegister.classList.add('active');
  tabLogin.classList.remove('active');
  registerForm.style.display = 'flex';
  loginForm.style.display = 'none';
});

const codeLines = [
'<!DOCTYPE html>',
'<html lang="en">',
'<head>',
'  <title>Koderyon</title>',
'</head>',
'<body>',
'  <div class="hero">',
'    <h1>Welcome to Koderyon</h1>',
'    <p>Learn to code.</p>',
'  </div>',
'</body>',
'</html>'
];
const fullCode = codeLines.join('\n');

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(raw){
  let s = escapeHtml(raw);
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-comment">$1</span>');
  s = s.replace(/([a-zA-Z-]+)(=)(&quot;[^&]*&quot;|"[^"]*")/g, '<span class="tok-attr">$1</span>$2<span class="tok-string">$3</span>');
  s = s.replace(/(&lt;\/?)([a-zA-Z0-9]+)/g, '$1<span class="tok-tag">$2</span>');
  return s;
}
function renderLineNumbers(count){
  const ln = document.getElementById('lineNumbers');
  let out = '';
  for(let i=1;i<=count;i++) out += i + '\n';
  ln.textContent = out;
}

const codeArea = document.getElementById('codeArea');
let idx = 0;
const typeSpeed = 16;

function typeStep(){
  if(idx <= fullCode.length){
    const typed = fullCode.slice(0, idx);
    const linesSoFar = typed.split('\n').length;
    renderLineNumbers(Math.max(linesSoFar, 1));
    codeArea.innerHTML = highlight(typed) + '<span class="caret"></span>';
    idx++;
    setTimeout(typeStep, typeSpeed);
  } else {
    setTimeout(runSequence, 500);
  }
}
setTimeout(typeStep, 700);

function runSequence(){
  const cursor = document.getElementById('fakeCursor');
  const runBtn = document.getElementById('runBtn');
  const editorShell = document.getElementById('editorShell');
  const outputScreen = document.getElementById('outputScreen');
  const leftPanel = document.querySelector('.left-panel');

  const shellRect = editorShell.getBoundingClientRect();
  const btnRect = runBtn.getBoundingClientRect();

  cursor.style.left = (shellRect.left + shellRect.width/2) + 'px';
  cursor.style.top = (shellRect.top + shellRect.height/2) + 'px';
  cursor.style.opacity = '1';

  requestAnimationFrame(() => {
    setTimeout(() => {
      cursor.style.left = (btnRect.left + btnRect.width/2 - 8) + 'px';
      cursor.style.top = (btnRect.top + btnRect.height/2 - 8) + 'px';
    }, 250);
  });

  setTimeout(() => {
    runBtn.classList.add('pressed');
    setTimeout(() => runBtn.classList.remove('pressed'), 180);
  }, 1300);

  setTimeout(() => {
    cursor.style.opacity = '0';
    editorShell.classList.add('leaving');
  }, 1600);

  setTimeout(() => {
    spawnParticles(leftPanel);
    outputScreen.classList.add('show');
    document.getElementById('welcomeText').classList.add('animate');
    document.getElementById('welcomeSub').classList.add('animate');
  }, 2250);
}

function spawnParticles(container){
  const count = 26;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random()*3 + 1.5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    const startX = Math.random()*100;
    const startY = Math.random()*100;
    p.style.left = startX + '%';
    p.style.top = startY + '%';
    p.style.opacity = (Math.random()*0.5 + 0.2).toFixed(2);
    container.appendChild(p);

    const dx = (Math.random()-0.5) * 60;
    const dy = (Math.random()-0.5) * 60;
    const dur = Math.random()*6000 + 5000;
    p.animate([
      { transform:'translate(0,0)' },
      { transform:`translate(${dx}px, ${dy}px)` },
      { transform:'translate(0,0)' }
    ], { duration: dur, iterations: Infinity, easing:'ease-in-out' });
  }
}
</script>
